name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run verify:build

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # These repository secrets are optional. When they are absent the
          # backend-dependent tests skip themselves and the rest of the suite
          # still runs — build, types, SEO, accessibility, mobile layout and
          # every route. Add them under Settings → Secrets → Actions to have CI
          # exercise the database paths too.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # Not a real credential: it exists so the "wrong password is rejected"
          # test has something to be wrong against. The real password lives in
          # Vercel and is never needed here.
          ADMIN_PASSWORD: ci-placeholder-not-a-real-password

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
